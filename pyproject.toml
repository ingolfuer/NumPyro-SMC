[project]
name = "numpyro_smc"
version = "0.1.2"
description = "Provides Sequential Monte Carlo sampling algorighms for NumPyro."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.9.1",
    "numpy>=2.4.2",
    "numpyro>=0.20.0",
]

[project.optional-dependencies]
cpu = ["jax[cpu]>=0.9.1"]
cuda12 = ["jax[cuda12]>=0.9.1"]
cuda13 = ["jax[cuda13]>=0.9.1"]
tpu = ["jax[tpu]>=0.9.1"]

[dependency-groups]
dev = [
    "arviz>=1.0.0",
    "black[jupyter]>=26.3.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "line-profiler>=5.0.2",
    "matplotlib>=3.10.8",
    "pyprojroot>=0.3.0",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
